<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#2a160d">
<link rel="stylesheet" href="style.css"><link rel="icon" href="img/logo-liner.png">
<title>Fiche produit — Liner</title></head><body data-v="auto">
<div id="hdr"></div><main>
<section class="p-hero" id="ph"><div class="wrap in"><div>
 <nav class="crumb"><a id="hm" href="index.html">Accueil</a><span>/</span><a href="produits.html">Produits</a><span>/</span><span id="cb"></span></nav>
 <h1 id="pn"></h1><div class="ar" id="pa"></div><p class="lead" id="pl"></p>
 <div class="vars" id="vars"></div><div class="chips" id="pc" style="margin-bottom:24px"></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn r" href="distributeurs.html">Commander en gros</a><a class="btn o" id="ask" href="#">Nous contacter</a></div></div>
 <div class="stage" id="stg"></div></div></section>
<section style="padding-top:clamp(40px,5vw,70px)"><div class="wrap pgrid">
 <div><div class="panel rv"><h2>Le produit</h2><p id="pd" style="font-size:17px"></p></div><div class="panel rv"><h2>Points clés</h2><ul id="pk"></ul></div></div>
 <div class="panel rv"><h2>En publication</h2><img id="cp" alt="" style="border-radius:16px" loading="lazy"><p class="note">Fiche technique (ingrédients, valeurs nutritionnelles, conditionnement) : à compléter avec Liner.</p></div>
</div></section>
<section style="padding-top:0"><div class="wrap"><div class="shead"><h2>Vous aimerez aussi</h2></div><div class="rel" id="rel"></div></div></section>
</main><div id="ftr"></div>
<script src="data.js"></script><script src="core.js"></script>
<script>
const q=new URLSearchParams(location.search).get('p'),k=P[q]?q:'duo',p=P[k];document.title=p.name+' — Liner';
document.getElementById('hm').href=HOME;document.getElementById('ask').href=HOME+'#contact';document.getElementById('ph').style.setProperty('--c',p.c);
document.getElementById('cb').textContent=p.name;document.getElementById('pn').textContent=p.name;document.getElementById('pa').textContent=p.ar;
document.getElementById('pl').textContent=p.short+(p.price?' Prix public : '+p.price+'.':'');
document.getElementById('stg').innerHTML=pimg(k,p.imgs?0:null);
document.getElementById('vars').innerHTML=p.var.map((v,i)=>'<button type="button" data-i="'+i+'" class="'+(i===0?'on':'')+'">'+v+'</button>').join('');
document.getElementById('vars').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#vars button').forEach(x=>x.classList.toggle('on',x===b));if(p.imgs&&p.imgs[+b.dataset.i]){const im=document.querySelector('#stg img');im.style.opacity=0;setTimeout(()=>{im.src=p.imgs[+b.dataset.i];im.style.opacity=1},200)}};
document.getElementById('pc').innerHTML='<span>'+CAT[p.cat][0]+'</span>'+(p.price?'<span>'+p.price+'</span>':'');
document.getElementById('pd').textContent=p.short+' '+(p.var.length>1?'Disponible en : '+p.var.join(', ')+'.':'');
document.getElementById('pk').innerHTML=p.pts.map(t=>'<li>'+t+'</li>').join('');
const cp=document.getElementById('cp');cp.src=p.camp;cp.alt='Publication '+p.name;
document.getElementById('rel').innerHTML=ORDER.filter(x=>x!==k).sort((a,b)=>(P[b].cat===p.cat)-(P[a].cat===p.cat)).slice(0,3).map(x=>{const r=P[x];return '<a class="pc" href="produit.html?p='+x+'" style="--c:'+r.c+'"><div class="vis">'+pimg(x)+'</div><div class="tx"><small>'+CAT[r.cat][0]+'</small><h3>'+r.name+'</h3><span class="go">Voir →</span></div></a>'}).join('');
reveal();
</script></body></html>

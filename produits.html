<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#2a160d">
<link rel="stylesheet" href="style.css"><link rel="icon" href="img/logo-liner.png">
<title>Nos produits — Liner</title></head><body data-v="auto">
<div id="hdr"></div><main>
<section class="p-hero" style="--c:#d0121b"><div class="wrap" style="padding-block:140px 60px"><nav class="crumb"><a id="hm" href="index.html">Accueil</a><span>/</span><span>Nos produits</span></nav><h1>Nos produits</h1><p class="lead">Barres à 10 DA, tablettes, praliné, biscuits et pâte à tartiner.</p></div></section>
<section><div class="wrap"><div class="filters" id="fl"></div><div class="grid" id="grid"></div></div></section>
</main><div id="ftr"></div>
<script src="data.js"></script><script src="core.js"></script>
<script>
document.getElementById('hm').href=HOME;let cat=new URLSearchParams(location.search).get('cat');if(!CAT[cat])cat='all';const fl=document.getElementById('fl');
function draw(){fl.innerHTML=[['all','Tout']].concat(Object.keys(CAT).map(c=>[c,CAT[c][0]])).map(x=>'<button type="button" data-c="'+x[0]+'" class="'+(x[0]===cat?'on':'')+'">'+x[1]+'</button>').join('');
document.getElementById('grid').innerHTML=ORDER.filter(k=>cat==='all'||P[k].cat===cat).map(k=>{const p=P[k];return '<a class="pc" href="produit.html?p='+k+'" style="--c:'+p.c+'"><div class="vis">'+pimg(k)+'</div><div class="tx"><small>'+CAT[p.cat][0]+(p.price?' · '+p.price:'')+'</small><h3>'+p.name+'</h3><p>'+p.short+'</p><span class="go">Voir la fiche →</span></div></a>'}).join('')}
fl.onclick=e=>{const b=e.target.closest('button');if(b){cat=b.dataset.c;draw()}};draw();
</script></body></html>

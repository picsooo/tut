<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0e1b33">
<title>Webminds × Liner — Proposition réseaux sociaux</title>
<style>
@font-face{font-family:MR;font-weight:700;src:url(../fonts/manrope-latin-700-normal.woff2)}@font-face{font-family:MR;font-weight:800;src:url(../fonts/manrope-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:radial-gradient(90% 70% at 50% 40%,#1b2d52,#0e1b33 60%,#070e1c);color:#fff;font-family:MR,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:12px}
header img{height:38px;color:#fff}
.dl{display:inline-flex;align-items:center;gap:8px;background:#d9a32a;color:#0e1b33;font:800 14px MR;padding:11px 16px;border-radius:12px;text-decoration:none;white-space:nowrap}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 10px;min-height:0}
#book{margin:0 auto}
.page{background:#f6f1e8;box-shadow:inset 0 0 30px rgba(0,0,0,.06)}
.page img{width:100%;height:100%;object-fit:cover;display:block}
footer{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px 18px}
footer button{width:52px;height:52px;border-radius:50%;border:1px solid rgba(217,163,42,.6);background:rgba(255,255,255,.06);color:#fff;font-size:22px;cursor:pointer}
footer button:hover{background:#d9a32a;color:#0e1b33}
#cnt{font:700 14px MR;letter-spacing:.15em;min-width:90px;text-align:center;opacity:.8}
.hint{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:8px 14px;border-radius:999px;font:700 13px MR;transition:opacity .6s;pointer-events:none}
.hint.gone{opacity:0}
</style></head><body>
<header><img src="logo-w.svg" alt="Webminds"><a class="dl" href="Webminds-Liner-proposition-reseaux-sociaux.pdf" download>⬇ Télécharger le PDF</a></header>
<div class="stage"><div id="book"></div></div>
<footer><button type="button" id="prev" aria-label="Page précédente">‹</button><span id="cnt">1 / 20</span><button type="button" id="next" aria-label="Page suivante">›</button></footer>
<div class="hint" id="hint">👆 Glisse ou clique sur le coin de la page pour la tourner</div>
<script src="page-flip.browser.js"></script>
<script>
const N=20,book=document.getElementById('book');
for(let i=1;i<=N;i++){const d=document.createElement('div');d.className='page';if(i===1||i===N)d.dataset.density='hard';d.innerHTML='<img src="p/p'+String(i).padStart(2,'0')+'.jpg" alt="Page '+i+'"'+(i>3?' loading="lazy"':'')+'>';book.appendChild(d)}
function dims(){const st=document.querySelector('.stage').getBoundingClientRect();const port=innerWidth<820;const ratio=1300/1000;let h=st.height-12,w=h/ratio;const maxW=port?st.width-20:(st.width-40)/2;if(w>maxW){w=maxW;h=w*ratio}return{w:Math.floor(w),h:Math.floor(h),port}}
const d=dims();
const pf=new St.PageFlip(book,{width:d.w,height:d.h,size:'fixed',showCover:true,usePortrait:d.port,mobileScrollSupport:false,maxShadowOpacity:.5,flippingTime:800,drawShadow:true});
pf.loadFromHTML(document.querySelectorAll('.page'));
const cnt=document.getElementById('cnt');const upd=()=>cnt.textContent=(pf.getCurrentPageIndex()+1)+' / '+N;
pf.on('flip',()=>{upd();document.getElementById('hint').classList.add('gone')});upd();
document.getElementById('prev').onclick=()=>pf.flipPrev();document.getElementById('next').onclick=()=>pf.flipNext();
addEventListener('keydown',e=>{if(e.key==='ArrowRight')pf.flipNext();if(e.key==='ArrowLeft')pf.flipPrev()});
setTimeout(()=>document.getElementById('hint').classList.add('gone'),6000);
let rt,lw=innerWidth;addEventListener("resize",()=>{if(Math.abs(innerWidth-lw)<60)return;clearTimeout(rt);rt=setTimeout(()=>location.reload(),400)});
</script>
</body></html>
